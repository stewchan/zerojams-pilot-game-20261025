<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Disposable target game</title><h1>Target game — pilot test</h1><p>Click the target five times. No scores or personal data are sent.</p><button id="target">Target</button><output id="score">0 / 5</output><script>let n=0;document.querySelector('#target').onclick=()=>{n=Math.min(5,n+1);document.querySelector('#score').textContent=n===5?'Finished!':n+' / 5';};</script></html>
